name: Feature request
description: Propose a focused scientific or software improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What research or reproducibility problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired interface, experiment, validation, or documentation.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Explain how the change could be tested or compared with a reference.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is consistent with the repository's documented modelling scope.
          required: true
