name: Bug report
description: Report a reproducible problem in the code, data, or documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the reproducibility of this project.
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, parameters, and smallest example that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and package version or commit.
      placeholder: Windows 11, Python 3.12, commit 27d135e
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste a short traceback or numerical discrepancy. Remove secrets and local paths.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I checked the modelling limitations in `docs/methodology.md`.
          required: true
