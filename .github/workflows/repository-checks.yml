name: repository-checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate notebooks and data
        run: python scripts/validate_repository.py
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python style
        run: |
          ruff check src examples experiments scripts tests
          ruff format --check src examples experiments scripts tests
      - name: Build source and wheel distributions
        run: python -m build
      - name: Run unit tests
        run: pytest
      - name: Reproduce reference figures
        run: python scripts/plot_reference_figures.py --output-dir /tmp/daqc-figures
      - name: Run the closed/open-system portfolio example
        run: python examples/h2_vibronic_open_system.py --output-dir /tmp/daqc-figures
      - name: Run the reduced research study
        run: python experiments/run_h2_study.py --quick --results-dir /tmp/daqc-results --figure-dir /tmp/daqc-figures
