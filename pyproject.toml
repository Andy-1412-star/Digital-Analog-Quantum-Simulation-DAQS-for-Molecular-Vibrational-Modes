[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daqc-fermion-boson"
version = "0.1.0"
description = "Reproducible digital-analog simulations of fermion-boson models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "qutip>=5.0,<6",
  "openfermion>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
notebooks = [
  "pandas>=2.1,<3.1",
  "qutip-qip>=0.4,<1",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
