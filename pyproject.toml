[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daqc-fermion-boson"
version = "0.1.0"
description = "Reproducible digital-analog simulations of fermion-boson models"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Andy Wu" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "digital-analog quantum simulation",
  "fermion-boson models",
  "molecular vibrations",
  "OpenFermion",
  "QuTiP",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "qutip>=5.0,<6",
  "openfermion>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
notebooks = [
  "pandas>=2.1,<3.1",
  "qutip-qip>=0.4,<1",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
]

[project.urls]
Repository = "https://github.com/Andy-1412-star/Digital-Analog-Quantum-Simulation-DAQS-for-Molecular-Vibrational-Modes"
Documentation = "https://github.com/Andy-1412-star/Digital-Analog-Quantum-Simulation-DAQS-for-Molecular-Vibrational-Modes#readme"
Issues = "https://github.com/Andy-1412-star/Digital-Analog-Quantum-Simulation-DAQS-for-Molecular-Vibrational-Modes/issues"
Results = "https://github.com/Andy-1412-star/Digital-Analog-Quantum-Simulation-DAQS-for-Molecular-Vibrational-Modes/blob/main/RESULTS.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["archive", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
